<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book details — Moss &amp; Page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M24 42V22" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M24 22c0-9 -7-14-15-14 0 9 6 16 15 16Z" fill="currentColor" opacity="0.85"/>
          <path d="M24 26c0-8 7-13 15-13 0 8.5-6.5 15-15 15Z" fill="currentColor" opacity="0.55"/>
        </svg>
        <span>
          <span class="brand-text">Moss &amp; Page</span>
          <span class="brand-sub" id="headerNote">a cozy reading nook</span>
        </span>
      </a>

      <div class="header-actions">
        <button type="button" id="nookToggle" class="nook-toggle" aria-haspopup="dialog" aria-expanded="false" aria-controls="nookPanel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
            <path d="M5 20V9a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v11" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 20v-6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 7c0-2.5-2-4-4-4 0 2.5 1.6 4.3 4 4Z" fill="currentColor" stroke="none"/>
          </svg>
          <span class="nook-toggle-label">My Nook</span>
          <span class="nook-badge" id="nookCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="container">
    <a href="index.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      Back to the shelf
    </a>

    <div id="bookDetail"></div>

    <section class="detail-section" id="relatedSection" hidden>
      <h2 class="section-title" id="relatedTitle">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c4 3 6 7 6 11a6 6 0 1 1-12 0c0-4 2-8 6-11Z"/></svg>
        More in this genre
      </h2>
      <ul class="related-strip-list book-grid" id="relatedStrip" aria-label="Related books"></ul>
    </section>
  </main>

  <div class="nook-backdrop" id="nookBackdrop"></div>
  <aside class="nook-panel" id="nookPanel" role="dialog" aria-modal="true" aria-labelledby="nookHeading" aria-hidden="true">
    <div class="nook-panel-header">
      <h2 id="nookHeading">My Reading Nook</h2>
      <button type="button" class="nook-close" id="nookClose" aria-label="Close reading nook">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="nook-plant-wrap">
      <div id="nookPlantSvg"></div>
      <p class="nook-plant-caption" id="nookPlantCaption"></p>
    </div>

    <div class="nook-list" id="nookList"></div>
  </aside>

  <footer class="site-footer">
    <div class="container footer-inner">
      <svg class="footer-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M12 21V9" stroke-linecap="round"/>
        <path d="M12 9C12 4 8 2 4 2c0 4.5 3.5 8 8 7Z" fill="currentColor" stroke="none" opacity="0.8"/>
        <path d="M12 12c0-4.5 4-6.5 8-6.5 0 4.5-3.5 7.5-8 7Z" fill="currentColor" stroke="none" opacity="0.5"/>
      </svg>
      <p>Moss &amp; Page — a cozy corner for readers</p>
      <p>Variation D — Web Technology</p>
    </div>
  </footer>

  <script src="js/books.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
