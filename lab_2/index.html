<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Products</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">Tech<span>Store</span></div>
        <nav>
            <a href="index.html">Products</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <div>
                <p class="eyebrow">WELCOME TO TECHSTORE</p>
                <h1>Find your next<br><span>favorite device.</span></h1>
                <p class="hero-text">Explore our collection of smartphones, laptops and accessories.</p>
            </div>
        </section>

        <section class="products-section">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">OUR COLLECTION</p>
                    <h2>Products</h2>
                </div>
                <p id="productCount"></p>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Brand</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="productTable"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 TechStore</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
