<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rock Paper Scissors</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="game">
<div class="badge">MINI GAME</div>
<h1>Rock Paper Scissors</h1>
<p class="subtitle">Choose your move and beat the computer!</p>
<div class="scoreboard">
<div class="score"><span>You</span><strong id="playerScore">0</strong></div>
<div class="vs">VS</div>
<div class="score"><span>Computer</span><strong id="computerScore">0</strong></div>
</div>
<div class="choices">
<button class="choice" data-choice="rock"><span>✊</span><small>Rock</small></button>
<button class="choice" data-choice="paper"><span>✋</span><small>Paper</small></button>
<button class="choice" data-choice="scissors"><span>✌️</span><small>Scissors</small></button>
</div>
<div class="result-card">
<p id="message">Make your move!</p>
<div class="moves"><div><span id="playerMove">❔</span><small>You</small></div><b>—</b><div><span id="computerMove">❔</span><small>Computer</small></div></div>
</div>
<button id="resetBtn" class="reset">Reset Game</button>
</main>
<script src="js/script.js"></script>
</body>
</html>
